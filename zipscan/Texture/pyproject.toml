[project]
name = "zipscan-texture"
version = "0.1.0"
description = "Depth-verified camera texture baking for Zipscan sessions"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "av>=14,<18", "opencv-python-headless>=4.10,<5", "pillow>=11,<13"]

[project.scripts]
zipscan-texture = "zipscan_texture.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
