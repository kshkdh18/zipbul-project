<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zipscan · 텍스처 결과</title><link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#edf3f8;background:#0b1017;color-scheme:dark}*{box-sizing:border-box}body{margin:0;overflow:hidden}header{position:absolute;top:0;left:0;right:0;padding:22px 28px;z-index:2;display:flex;align-items:center;gap:18px;background:linear-gradient(#0b1017ee,#0b101700)}.brand{color:#ff863b;font-weight:800;letter-spacing:.14em;font-size:15px}h1{font-size:18px;margin:0}.muted{color:#9badbf;font-size:12px}button,a.control{border:1px solid #354355;background:#192333;color:#e5ecf4;border-radius:9px;padding:10px 13px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer}button.active{border-color:#ff863b;background:#64371f;color:white}button:hover{background:#34435a}.spacer{flex:1}aside{position:absolute;z-index:2;top:94px;left:24px;width:252px;padding:19px;background:#101923eb;border:1px solid #2b3745;border-radius:16px;backdrop-filter:blur(10px)}.label{font-size:12px;color:#9badbf;margin:18px 0 7px}.stats{font-size:13px;line-height:1.9}.big{font-size:29px;font-weight:750;color:#7ad9df}.row{display:flex;gap:8px;flex-wrap:wrap}input[type=range]{width:100%;accent-color:#ff863b}.hint{position:absolute;bottom:22px;left:24px;z-index:2;font-size:12px;color:#a8bacb;background:#101923cc;padding:12px 16px;border-radius:12px}#status{position:absolute;bottom:22px;right:24px;z-index:2;background:#172230;padding:12px 16px;border-radius:12px;font-size:12px}#loading{position:absolute;inset:0;z-index:5;background:#0b1017;display:grid;place-content:center;text-align:center;gap:14px}#loading.hidden{display:none}#loading strong{font-size:22px}.warn{font-size:12px;color:#e7b877;line-height:1.65;margin-top:16px}canvas{display:block}aside.collapsed{display:none}a{color:#91d9e3}@media(max-width:800px){aside{top:84px;width:210px;max-height:65vh;overflow:auto}header{padding:16px;gap:10px}header h1{display:none}.hint{max-width:70%;font-size:11px}.control{padding:8px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<header><span class="brand">ZIPSCAN</span><h1>현장 텍스처</h1><span class="spacer"></span><button id="details-toggle">정보</button><button id="textured" class="active">사진 텍스처</button><button id="raw">원본 형태</button><a class="control" href="textured.glb" download>GLB 다운로드</a></header>
<aside id="details"><div class="muted">텍스처가 적용된 면적</div><div class="big" id="coverage">—</div><div class="stats" id="stats"></div><div class="label">시점</div><div class="row"><button id="reset">전체 보기</button><button id="top">위에서 보기</button></div><div class="label">촬영 위치로 이동</div><input id="frame" type="range" min="0" max="1" value="0"><div class="muted" id="frame-label"></div><div class="label">위쪽 공간 잘라보기</div><input id="clip" type="range" min="0" max="1" step="0.01" value="1"><div class="row"><button id="ceiling">천장 숨기기</button><button id="no-clip">전체 높이</button></div><p class="warn">회색 면은 깊이·영상 대응이 확인되지 않은 영역입니다. 촬영되지 않은 표면을 생성하거나 메쉬의 구멍을 메우지 않았습니다.</p><a href="report.json" target="_blank" class="muted">처리 보고서</a></aside>
<div class="hint">드래그 회전 · 휠 확대 · 우클릭 이동 · 더블클릭한 지점으로 가까이</div><div id="status">모델을 불러오는 중</div><div id="loading"><strong>공간에 사진을 연결하고 있습니다</strong><span id="load-progress" class="muted">고해상도 모델을 불러옵니다.</span></div>
<script type="module" src="viewer.js"></script>
</body></html>
