name: Zipscan
options:
  bundleIdPrefix: com.zipbul
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  ZipscanCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: V2XX3EAA58
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  Zipscan:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ZipscanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zipbul.zipscan
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Zipscan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ''
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: 현장의 영상과 LiDAR 공간 데이터를 함께 수집합니다.
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  ZipscanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Zipscan
      - package: ZipscanCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zipbul.zipscan.tests
  ZipscanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Zipscan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zipbul.zipscan.uitests
schemes:
  Zipscan:
    build:
      targets:
        Zipscan: all
    test:
      targets: [ZipscanTests, ZipscanUITests]
