[project]
name = "zipcontrol"
version = "0.1.0"
description = "Handheld camera guidance with Android touch and 3D command visualization"
requires-python = ">=3.12,<3.14"
dependencies = [
    "av>=16,<18",
    "numpy>=2,<3",
    "openai>=3.26,<4",
    "pillow>=11,<13",
    "PySide6>=6.8,<7",
    "python-dotenv>=1,<2",
]

[project.scripts]
zipcontrol = "zipcontrol.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zipcontrol"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
